name: Lean 4

on:
  push:
    branches: [master, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ sqlite3
      - uses: leanprover/lean-action@v1
        with:
          build: 'true'
          test: 'true'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Exercise the command line
        run: python3 scripts/lean-cli-smoke.py
      - name: Run the public Lean example
        run: |
          python3 scripts/run-lean.py lean-examples/Usage.lean
          python3 scripts/run-lean.py lean-examples/Runtime.lean
          python3 scripts/run-lean.py lean-examples/Abac.lean
